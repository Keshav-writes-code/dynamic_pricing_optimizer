name: Build and Push Release Binary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Run Trainer
        run: cargo run --release -p cli -- 10000

      - name: Build web_server
        run: cargo build --release -p web_server

      - name: Strip .gitignore of data files
        run: |
          sed -i '/\*\.parquet/d' .gitignore
          sed -i '/\*\.msgpack/d' .gitignore

      - name: Commit and push binary to release branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create or switch to the release branch (based on current main)
          git checkout -B release

          # Force add the binary (overrides potential .gitignore rules)
          git add -f target/release/web_server

          # Add the modified .gitignore and the data files
          git add .gitignore *.parquet *.msgpack || true

          # Commit the changes. [skip ci] prevents an infinite loop of workflows
          git commit -m "chore: add release binary and data files [skip ci]" || echo "No changes to commit"

          # Push to the release branch (force push to keep history aligned with main)
          git push origin release --force
